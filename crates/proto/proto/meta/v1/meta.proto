syntax = "proto3";

package fluxfs.meta.v1;

// Domain objects travel as JSON bytes so prost types do not leak into VFS/Manifest.
// Convert at the crate boundary via fluxfs_proto::meta_codec.

service MetaService {
  rpc GetInode(GetInodeRequest) returns (GetInodeResponse);
  rpc Lookup(LookupRequest) returns (LookupResponse);
  rpc Create(CreateRequest) returns (CreateResponse);
  rpc Readdir(ReaddirRequest) returns (ReaddirResponse);
  rpc PutInode(PutInodeRequest) returns (PutInodeResponse);
  rpc PutManifest(PutManifestRequest) returns (PutManifestResponse);
  // Atomically store a new manifest and CAS-update the inode head.
  rpc CommitInodeManifest(CommitInodeManifestRequest) returns (CommitInodeManifestResponse);
  rpc ReserveChunks(ReserveChunksRequest) returns (ReserveChunksResponse);
  rpc AbortChunkReservation(AbortChunkReservationRequest) returns (AbortChunkReservationResponse);
  rpc CommitInodeManifestReserved(CommitInodeManifestReservedRequest) returns (CommitInodeManifestResponse);
  rpc TombstoneGcBatch(TombstoneGcBatchRequest) returns (TombstoneGcBatchResponse);
  rpc ListGcTombstones(ListGcTombstonesRequest) returns (ListGcTombstonesResponse);
  rpc FinalizeGcTombstones(FinalizeGcTombstonesRequest) returns (FinalizeGcTombstonesResponse);
  rpc GetManifest(GetManifestRequest) returns (GetManifestResponse);
  rpc BeginFlush(BeginFlushRequest) returns (BeginFlushResponse);
  rpc CommitFlush(CommitFlushRequest) returns (CommitFlushResponse);
  rpc FailFlushConflict(FailFlushConflictRequest) returns (FailFlushConflictResponse);
  rpc ListFlushIntents(ListFlushIntentsRequest) returns (ListFlushIntentsResponse);
  rpc BeginGc(BeginGcRequest) returns (BeginGcResponse);
  rpc CurrentGcPlan(CurrentGcPlanRequest) returns (CurrentGcPlanResponse);
  rpc FinishGc(FinishGcRequest) returns (FinishGcResponse);
  rpc ImportExternal(ImportExternalRequest) returns (ImportExternalResponse);
  rpc Unlink(UnlinkRequest) returns (UnlinkResponse);
  rpc Ping(PingRequest) returns (PingResponse);
}

message PingRequest {}
message PingResponse { string version = 1; }

message GetInodeRequest { uint64 id = 1; }
message GetInodeResponse { bytes inode_json = 1; }

message LookupRequest {
  uint64 parent = 1;
  string name = 2;
}
message LookupResponse { bytes inode_json = 1; }

message CreateRequest {
  uint64 parent = 1;
  string name = 2;
  uint32 file_type = 3; // 0=dir, 1=regular
  uint32 mode = 4;
  uint32 uid = 5;
  uint32 gid = 6;
  string request_id = 7;
  // 0 = unset (no directory CAS). Directory generations start at 1.
  uint64 expected_parent_generation = 8;
}
message CreateResponse { bytes inode_json = 1; }

message ReaddirRequest { uint64 dir = 1; }
message ReaddirResponse { bytes dentries_json = 1; }

message PutInodeRequest { bytes inode_json = 1; }
message PutInodeResponse {}

message PutManifestRequest { bytes manifest_json = 1; }
message PutManifestResponse { uint64 manifest_id = 1; }

message CommitInodeManifestRequest {
  uint64 expected_generation = 1;
  bytes inode_json = 2;
  bytes manifest_json = 3;
  // Client RequestOpId; empty means server allocates a fresh id (not retry-safe).
  string request_id = 4;
}
message CommitInodeManifestResponse {
  bytes inode_json = 1;
  uint64 manifest_id = 2;
}

message ReserveChunksRequest {
  uint64 ticket = 1;
  uint64 inode = 2;
  uint64 expected_generation = 3;
  bytes chunks_json = 4;
  string request_id = 5;
}
message ReserveChunksResponse {}
message AbortChunkReservationRequest { uint64 ticket = 1; string request_id = 2; }
message AbortChunkReservationResponse {}
message CommitInodeManifestReservedRequest {
  uint64 ticket = 1;
  uint64 expected_generation = 2;
  bytes inode_json = 3;
  bytes manifest_json = 4;
  string request_id = 5;
}
message TombstoneGcBatchRequest { bytes chunks_json = 1; string request_id = 2; }
message TombstoneGcBatchResponse { bytes batch_json = 1; }
message ListGcTombstonesRequest {}
message ListGcTombstonesResponse { bytes chunks_json = 1; }
message FinalizeGcTombstonesRequest { bytes chunks_json = 1; string request_id = 2; }
message FinalizeGcTombstonesResponse {}

message GetManifestRequest { uint64 id = 1; }
message GetManifestResponse { bytes manifest_json = 1; }

message BeginFlushRequest {
  uint64 inode = 1;
  uint64 expected_generation = 2;
  bytes intent_json = 3;
  string request_id = 4;
}
message BeginFlushResponse { bytes inode_json = 1; }

message CommitFlushRequest {
  uint64 inode = 1;
  uint64 expected_generation = 2;
  uint64 flush_id = 3;
  bytes published_ufs_json = 4;
  string request_id = 5;
}
message CommitFlushResponse { bytes inode_json = 1; }

message FailFlushConflictRequest {
  uint64 inode = 1;
  uint64 expected_generation = 2;
  uint64 flush_id = 3;
  string error = 4;
  string request_id = 5;
}
message FailFlushConflictResponse { bytes inode_json = 1; }

message ListFlushIntentsRequest {}
message ListFlushIntentsResponse { bytes intents_json = 1; }

message BeginGcRequest {
  uint64 lease_id = 1;
  string request_id = 2;
}
message BeginGcResponse { bytes plan_json = 1; }

message CurrentGcPlanRequest {}
message CurrentGcPlanResponse {
  bool present = 1;
  bytes plan_json = 2;
}

message FinishGcRequest {
  uint64 lease_id = 1;
  string request_id = 2;
}
message FinishGcResponse {}

message ImportExternalRequest {
  uint64 parent = 1;
  string name = 2;
  bytes inode_json = 3;
  // Empty = no manifest (directory / zero-size file).
  bytes manifest_json = 4;
  string request_id = 5;
  // 0 = unset (no directory CAS). Directory generations start at 1.
  uint64 expected_parent_generation = 6;
}
message ImportExternalResponse { bytes inode_json = 1; }

message UnlinkRequest {
  uint64 parent = 1;
  string name = 2;
  // 0 = unset (no directory CAS). Directory generations start at 1.
  uint64 expected_parent_generation = 3;
}
message UnlinkResponse {}
